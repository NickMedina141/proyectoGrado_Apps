<!DOCTYPE html>
<html>
<head>
    <title>Mapa de Estudiantes</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
        }
        .leaflet-popup-content {
            font-weight: bold;
            font-size: 14px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Inicializar mapa centrado en Colombia
        var map = L.map('map').setView([4.5709, -74.2973], 6);

        // Capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markers = [];
        var haCentrado = false;
        
        var redIcon = new L.Icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Funci&oacute;n llamada desde PyQt para cargar estudiantes
        function cargarPines(data) {
            // Limpiar pines anteriores
            markers.forEach(function(m) {
                map.removeLayer(m);
            });
            markers = [];
            
            if (data.length === 0) return;

            var group = new L.featureGroup();

            data.forEach(function(est) {
                if (est.lat && est.lon) {
                    var m = L.marker([est.lat, est.lon], {icon: redIcon}).addTo(map)
                        .bindPopup("<b>" + est.nombre + "</b>");
                    m.on('click', function(e) { map.setView(e.latlng, 15); });
                    markers.push(m);
                    group.addLayer(m);
                }
            });

            if (markers.length > 0 && !haCentrado) {
                map.fitBounds(group.getBounds().pad(0.2));
                haCentrado = true;
            }
        }
    </script>
</body>
</html>
